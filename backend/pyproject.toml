[project]
name = "ignis"
version = "0.2.0"
description = "IGNIS — DSS de monitoramento de incêndios florestais (coletor, API e worker)."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0.30",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "black>=24.4",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ignis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: testes de integração que precisam de um PostgreSQL+PostGIS (variável TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]  # Depends(...) em default de argumento é o idioma do FastAPI

[tool.black]
line-length = 110
target-version = ["py312"]
